name: Desktop installers
on:
  push:
    branches: [codex/macos-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm run setup:desktop
      - run: npm run check
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:ui
      - if: matrix.platform == 'win32'
        run: npm run build:windows
      - if: matrix.platform == 'darwin'
        run: npm run build:mac
      - run: npm --prefix desktop run test:package
      - run: node desktop/scripts/collect-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netplex-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: netplex-*
          merge-multiple: true
          path: release-assets
      - run: node desktop/scripts/draft-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
